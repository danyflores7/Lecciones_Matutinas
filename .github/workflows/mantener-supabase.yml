# Supabase (plan gratuito) pausa el proyecto tras 7 días sin actividad, y
# entonces las instalaciones nuevas de la app se quedan sin contenido.
# Esta tarea hace una consulta pequeña dos veces por semana para mantenerlo
# activo. La llave es la anónima de solo lectura (la misma que va en la app).
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 14 * * 1,4' # lunes y jueves, 08:17 hora del centro de México
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la matutina de hoy
        env:
          SB_URL: https://vyughgekzftsgkfcuyeq.supabase.co
          SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5dWdoZ2VremZ0c2drZmN1eWVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzQ2NjcsImV4cCI6MjA5NzIxMDY2N30.SovowH4a4IW76P4oLIj6vvzFDqDbCMQtzrjY8o0JwUk
        run: |
          code=$(curl -sS -o respuesta.json -w '%{http_code}' \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/versiculos_dia?select=fecha&limit=1")
          echo "HTTP $code"; cat respuesta.json; echo
          test "$code" = "200"
